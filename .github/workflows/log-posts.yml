name: Log posts

# Runs when a posts/<date>.json file lands on main or on a posts/** branch:
# writes the post links into the Posted tab and fetches YouTube numbers.
# (Daily YouTube numbers for posted clips are refreshed by the Tracker workflow.)
on:
  push:
    branches: [main, "posts/**"]
    paths: ["posts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-posts
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write posts to the sheet + YouTube numbers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.log_posts all
