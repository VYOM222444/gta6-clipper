name: Social post

# Posts rendered clips to Instagram + Facebook (agents/post_social.py) after the veto window.
# Started by the Tracker (chain, ~every 6 h) + manual button. Does nothing until the secret
# META_TOKENS_JSON is set.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be posted"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post due clips
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_TOKENS_JSON: ${{ secrets.META_TOKENS_JSON }}
        run: python -u -m agents.post_social ${{ inputs.dry_run && '--dry-run' || '' }}
