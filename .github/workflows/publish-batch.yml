name: Publish batch

# Runs when Claude pushes a batch file on a branch named batch/<date>.
# Writes the clips into the Batch tab; the owner approves by typing "yes".
on:
  push:
    branches: ["batch/**"]
    paths: ["batches/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-batch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write batch to the sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.publish_batch
