name: Researcher

# Once a day at 01:23 UTC (06:53 IST): study GTA 6 Shorts that are 3-14 days old, tag 20
# winners + 20 average with Gemini Flash-Lite (blind), write winners-vs-average findings to
# the Playbook tab. Also started by the external scheduler; a guard skips the run if it
# really ran < 20 h ago. ~1,200 YouTube units, up to 45 Flash-Lite calls. Plus a manual button.
# Saves data/gemini_usage_researcher.json (its own daily call counter) back to the repo.
# Plus a second, smaller run at 11:23 UTC (16:53 IST, before the Decider): fresh tier only
# (Shorts 0-72 h old, "what works right now"), ~500 units, up to 20 Flash-Lite calls. The
# morning run also does the fresh tier.
on:
  schedule:
    - cron: "23 1 * * *"
    - cron: "23 11 * * *"
    # Deep analysis every 3 h (no YouTube searches, only Gemini Flash-Lite on Shorts already
    # collected). Runs only when the repo variable DEEP_RESEARCH = on (it costs Actions minutes;
    # free and unlimited once the repo is public).
    - cron: "53 */3 * * *"
  workflow_dispatch:
    inputs:
      from_trigger:
        description: "Set by the external scheduler: skip if it ran recently"
        required: false
        default: ""
      mode:
        description: "all (settled + fresh), fresh (0-72 h Shorts only), deep (analyse as many collected Shorts as the Gemini budget allows, no YouTube) or findings (only recompute Playbook)"
        required: false
        default: "all"

permissions:
  contents: write
  actions: write

concurrency:
  group: researcher
  cancel-in-progress: false

jobs:
  guard:
    # Skip a scheduled / external-trigger run if research really ran < 20 h ago (overlapping
    # triggers). Manual button and chain starts always run. Not needed for fresh / deep runs.
    if: github.event.schedule != '23 11 * * *' && github.event.schedule != '53 */3 * * *' && inputs.mode != 'fresh' && inputs.mode != 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.from_trigger }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/researcher.yml/runs?status=success&per_page=8" -q '.workflow_runs[].id'); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" -q '.jobs[] | select(.name=="research" and .conclusion=="success") | .started_at')
            [ -n "$last" ] && break
          done
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $(( 20 * 3600 )) ]; then
            echo "Last real run started $last (< 20 h ago): skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last real run: ${last:-never}. Running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  research:
    needs: guard
    if: needs.guard.outputs.skip != 'true' && github.event.schedule != '23 11 * * *' && github.event.schedule != '53 */3 * * *' && inputs.mode != 'fresh' && inputs.mode != 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # latest main, not the commit from when the run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Study winning Shorts
        env:
          PYTHONUNBUFFERED: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.researcher ${{ inputs.mode == 'findings' && 'findings' || 'all' }}
      - name: Save Gemini call counter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_usage_researcher.json data/channel_baselines.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "researcher: gemini usage $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

  research-fresh:
    # Afternoon run (or manual mode=fresh): fresh tier only. No guard: cheap, and its name
    # differs from "research", so it never makes the morning guard skip.
    if: github.event.schedule == '23 11 * * *' || inputs.mode == 'fresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # latest main, not the commit from when the run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Study Shorts rising right now
        env:
          PYTHONUNBUFFERED: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.researcher fresh
      - name: Save Gemini call counter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_usage_researcher.json data/channel_baselines.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "researcher: gemini usage $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

  research-deep:
    # Every 3 h when DEEP_RESEARCH = on (or manual mode=deep): analyse up to researcher.deep.per_run
    # collected Shorts (never-analysed first, then old ones missing the newest tags), then findings.
    if: (github.event.schedule == '53 */3 * * *' && vars.DEEP_RESEARCH == 'on') || inputs.mode == 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # latest main, not the commit from when the run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deep analysis of collected Shorts
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.researcher deep
      - name: Save Gemini call counter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_usage_researcher.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "researcher: gemini usage $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
      # Only AFTER the counter is pushed: the next run must read this run's calls (started before
      # the push, every other run read the old counter and its count was lost: 2x real usage).
      - name: Start the next deep run (backlog left and Gemini budget left today)
        if: success() && hashFiles('data/.deep_continue') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run researcher.yml --ref "$GITHUB_REF_NAME" -f mode=deep
