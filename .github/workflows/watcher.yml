name: Watcher

# Gemini checks the best Signals windows (and short videos with no signals).
# Started by Signals after every Signals run (chain), plus one backup cron slot at
# 12:47 UTC (18:17 IST, before the evening batch; skipped if it ran < 2 h ago) and a manual
# button. The daily Gemini budget (15) is enforced in code.
# Saves data/gemini_usage.json (daily call counter) back to the repo.
on:
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      from_trigger:
        description: "Set by the external scheduler: skip if it ran recently"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  guard:
    # Skip a scheduled / external-trigger run if watch really ran < 2 h ago (overlapping
    # triggers). Manual button and chain starts always run.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.from_trigger }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watcher.yml/runs?status=success&per_page=8" -q '.workflow_runs[].id'); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" -q '.jobs[] | select(.name=="watch" and .conclusion=="success") | .started_at')
            [ -n "$last" ] && break
          done
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $(( 2 * 3600 )) ]; then
            echo "Last real run started $last (< 2 h ago): skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last real run: ${last:-never}. Running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  watch:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check moments with Gemini
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.watcher
      - name: Save Gemini call counter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_usage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "watcher: gemini usage $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Start Gatekeeper (chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/gatekeeper.yml/dispatches" -f ref="$GITHUB_REF_NAME"
