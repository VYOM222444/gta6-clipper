name: Scout

# Every 6 hours at :37 (UTC 00:37, 06:37, 12:37, 18:37 = IST 06:07, 12:07, 18:07, 00:07).
# GitHub delays or skips cron runs at busy times (e.g. the top of the hour), so we use odd minutes;
# plus a manual button: Actions > Scout > Run workflow.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find trending GTA 6 videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.scout
