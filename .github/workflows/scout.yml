name: Scout

# Every 6 hours at :37 (UTC 00:37, 06:37, 12:37, 18:37 = IST 06:07, 12:07, 18:07, 00:07).
# GitHub delays or skips cron runs at busy times (e.g. the top of the hour), so we use odd minutes;
# plus a manual button: Actions > Scout > Run workflow, plus the external scheduler
# (tools/apps_script_trigger.gs). A guard skips the run if Scout really ran < 5 h ago.
# After every run it starts Tracker -> Signals -> Watcher (chain).
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      from_trigger:
        description: "Set by the external scheduler: skip if it ran recently"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  guard:
    # Skip a scheduled / external-trigger run if scout really ran < 5 h ago (overlapping
    # triggers). Manual button and chain starts always run.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.from_trigger }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scout.yml/runs?status=success&per_page=8" -q '.workflow_runs[].id'); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" -q '.jobs[] | select(.name=="scout" and .conclusion=="success") | .started_at')
            [ -n "$last" ] && break
          done
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $(( 5 * 3600 )) ]; then
            echo "Last real run started $last (< 5 h ago): skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last real run: ${last:-never}. Running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  scout:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find trending GTA 6 videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.scout
      - name: Start Tracker (chain; GitHub skips many cron runs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/tracker.yml/dispatches" -f ref="$GITHUB_REF_NAME"
