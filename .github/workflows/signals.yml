name: Signals

# GitHub part of Signals: timestamped comments only (YouTube blocks yt-dlp on GitHub).
# Chat spikes + Most Replayed run in Colab: colab/signals.ipynb.
# Started by Tracker after every Tracker run (chain), plus a manual button. It only uses
# ~1 YouTube unit per video. After every run it starts the Watcher.
on:
  workflow_dispatch:
    inputs:
      from_trigger:
        description: "Set by the Apps Script (live stream ended); leave empty"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find moments from timestamped comments
        env:
          SIGNALS_MODE: api
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.signals
      - name: Start Watcher (chain; GitHub skips many cron runs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/watcher.yml/dispatches" -f ref="$GITHUB_REF_NAME"
