name: Signals

# GitHub part of Signals: timestamped comments only (YouTube blocks yt-dlp on GitHub).
# Chat spikes + Most Replayed run in Colab: colab/signals.ipynb.
# Twice a day at UTC 00:40 and 12:40 = IST 06:10 and 18:10, before the Watcher runs,
# plus a manual button: Actions > Signals > Run workflow.
on:
  schedule:
    - cron: "40 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find moments from timestamped comments
        env:
          SIGNALS_MODE: api
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agents.signals
